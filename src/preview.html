<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Paste Easy 预览</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="preview.css">
</head><body>
  <main class="preview-shell" inert>
    <header class="preview-toolbar">
      <button id="closePreview" class="icon-button" title="关闭预览" aria-label="关闭预览"><i data-lucide="circle-x"></i></button>
      <h1 id="previewTitle">预览</h1>
      <div class="preview-actions">
        <button id="recognizePreview" class="icon-button" title="识别文字" aria-label="识别文字" aria-pressed="false" hidden><i data-lucide="scan-text"></i></button>
        <button id="pinPreview" class="icon-button" title="固定" aria-label="固定"><i data-lucide="pin"></i></button>
        <button id="sharePreview" class="icon-button" title="分享" aria-label="分享"><i data-lucide="share"></i></button>
        <button id="editPreview" class="icon-button" title="编辑" aria-label="编辑"><i data-lucide="pencil"></i></button>
        <button id="savePreview" class="icon-button" title="保存" aria-label="保存" hidden><i data-lucide="check"></i></button>
      </div>
    </header>
    <nav id="editTools" class="edit-tools" aria-label="文字格式" hidden>
      <button class="icon-button" data-command="bold" title="粗体" aria-label="粗体" aria-pressed="false"><i data-lucide="bold"></i></button>
      <button class="icon-button" data-command="italic" title="斜体" aria-label="斜体" aria-pressed="false"><i data-lucide="italic"></i></button>
      <button class="icon-button" data-command="underline" title="下划线" aria-label="下划线" aria-pressed="false"><i data-lucide="underline"></i></button>
      <button class="icon-button" data-command="strike" title="删除线" aria-label="删除线" aria-pressed="false"><i data-lucide="strikethrough"></i></button>
      <span class="tool-divider"></span>
      <button class="icon-button" data-command="undo" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button>
      <button class="icon-button" data-command="redo" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button>
    </nav>
    <nav id="imageTools" class="edit-tools" aria-label="图片编辑" hidden>
      <button class="icon-button" data-image="left" title="向左旋转" aria-label="向左旋转"><i data-lucide="rotate-ccw"></i></button>
      <button class="icon-button" data-image="right" title="向右旋转" aria-label="向右旋转"><i data-lucide="rotate-cw"></i></button>
      <button class="icon-button" data-image="background" title="移除背景" aria-label="移除背景" aria-pressed="false"><i data-lucide="blend"></i></button>
      <span class="tool-divider"></span>
      <button class="icon-button" data-image="undo" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button>
      <button class="icon-button" data-image="redo" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button>
      <button class="icon-button" data-image="restore" title="恢复原图" aria-label="恢复原图"><i data-lucide="image-up"></i></button>
    </nav>
    <div class="preview-workspace">
      <section id="previewContent" class="preview-content" aria-label="项目预览"></section>
      <aside id="ocrPanel" class="ocr-panel" aria-label="图片文字" hidden>
        <header><h2>识别文字</h2><div class="ocr-actions"><button id="copyOCR" class="icon-button" title="复制识别文字" aria-label="复制识别文字"><i data-lucide="copy"></i></button><button id="retryOCR" class="icon-button" title="重新识别" aria-label="重新识别"><i data-lucide="refresh-cw"></i></button></div></header>
        <p id="ocrState" role="status" hidden></p>
        <textarea id="ocrText" aria-label="识别结果" readonly spellcheck="false"></textarea>
      </aside>
    </div>
    <footer class="preview-footer"><span id="previewMeta"></span><button id="copyPreview" class="icon-button" title="复制" aria-label="复制"><i data-lucide="copy"></i></button></footer>
    <div id="previewPinboards" class="preview-pinboards" hidden></div>
    <p id="previewStatus" class="preview-status" role="status" hidden></p>
  </main>
  <script src="../node_modules/lucide/dist/umd/lucide.js"></script><script src="../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="model.js"></script><script src="vendor/editor.js"></script><script src="preview.js"></script>
</body></html>
