<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Paste Easy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <header class="toolbar">
      <div class="navigation">
        <button id="searchToggle" class="icon-button" title="搜索" aria-label="搜索"><i data-lucide="search"></i></button>
        <div id="searchBox" class="search-box" hidden>
          <i data-lucide="search"></i>
          <div class="search-composer"><div id="filterTokens" class="filter-tokens" role="group" aria-label="活动筛选"></div>
          <input id="searchInput" aria-label="搜索剪贴板" placeholder="搜索" autocomplete="off" type="search" aria-controls="filterSuggestions"></div>
          <button id="searchClear" class="icon-button small" title="清除搜索" aria-label="清除搜索"><i data-lucide="circle-x"></i></button>
          <button id="filterToggle" class="icon-button small" title="筛选" aria-label="筛选" aria-controls="filters" aria-expanded="false"><i data-lucide="list-filter"></i><span id="filterCount" hidden></span></button>
        </div>
        <nav id="boards" class="boards" aria-label="Pinboard"></nav>
        <button id="addBoard" class="icon-button" title="创建 Pinboard" aria-label="创建 Pinboard"><i data-lucide="plus"></i></button>
      </div>
      <div class="toolbar-end">
        <button id="stackButton" class="icon-button" title="Paste Stack" aria-label="Paste Stack"><i data-lucide="layers"></i><span id="stackCount" hidden></span></button>
        <button id="moreButton" class="icon-button" title="更多" aria-label="更多"><i data-lucide="ellipsis"></i></button>
      </div>
    </header>
    <section id="timeline" class="timeline" role="listbox" aria-label="剪贴板历史" aria-orientation="horizontal" aria-multiselectable="true" tabindex="0"><div id="track" class="track"></div></section>
    <div id="emptyState" class="empty-state" hidden><span id="emptyTitle">剪贴板为空</span></div>
    <div id="status" class="status" role="status" hidden></div>
    <div id="menu" class="menu" role="menu" hidden></div>
    <div id="filterSuggestions" class="filter-suggestions menu" role="group" aria-label="筛选建议" hidden></div>
    <section id="filters" class="filter-panel" aria-label="筛选条件" hidden>
      <div class="filter-heading">类型</div><div id="typeFilters" class="filter-options"></div>
      <div class="filter-heading">应用</div><select id="sourceFilter" aria-label="来源应用"><option value="">所有应用</option></select>
      <div class="filter-heading">日期</div><select id="dateFilter" aria-label="复制日期"><option value="">所有时间</option><option value="today">今天</option><option value="yesterday">昨天</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select>
      <div class="filter-heading">Pinboard</div><select id="pinboardFilter" aria-label="所属 Pinboard"><option value="">所有 Pinboard</option></select>
      <button id="resetFilters" class="reset-filters" type="button"><i data-lucide="rotate-ccw"></i><span>重置筛选</span></button>
    </section>
  </main>
  <script src="../node_modules/lucide/dist/umd/lucide.js"></script>
  <script src="model.js"></script>
  <script src="search-filters.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
