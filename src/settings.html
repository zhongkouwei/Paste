<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Paste Easy 设置</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="settings.css">
</head>
<body class="settings-window">
  <aside class="settings-sidebar">
    <nav aria-label="设置分类">
      <button class="active" data-page="general"><i data-lucide="settings"></i>通用</button>
      <button data-page="privacy"><i data-lucide="hand"></i>隐私</button>
      <button data-page="shortcuts"><i data-lucide="keyboard"></i>键盘快捷键</button>
      <button data-page="data"><i data-lucide="database"></i>数据</button>
      <button data-page="about"><i data-lucide="badge-check"></i>关于</button>
    </nav><span class="settings-brand">Paste Easy</span>
  </aside>
  <main class="settings-content">
    <h1 id="pageTitle">通用</h1>
    <section data-section="general">
      <div class="settings-group">
        <label class="setting-row"><span>登录时打开</span><input type="checkbox" role="switch" data-setting="launchAtLogin"></label>
        <label class="setting-row"><span>后台运行</span><input type="checkbox" role="switch" data-setting="background"></label>
        <label class="setting-row"><span>显示在菜单栏上</span><input type="checkbox" role="switch" data-setting="showInMenuBar"></label>
        <label class="setting-row"><span>音效</span><input type="checkbox" role="switch" data-setting="sound"></label>
        <label class="setting-row"><span>暂停记录</span><input type="checkbox" role="switch" data-setting="paused"></label>
        <label class="setting-row"><span>外观</span><select data-setting="theme" aria-label="外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
      </div>
      <h2>粘贴项目</h2>
      <div class="settings-group">
        <label class="radio-row"><input type="radio" name="pasteTarget" value="application"><span>到当前活动应用<small>将选定的项目直接粘贴到当前应用中。</small></span></label>
        <label class="radio-row"><input type="radio" name="pasteTarget" value="clipboard"><span>到剪贴板<small>复制到系统剪贴板，稍后手动粘贴。</small></span></label>
        <label class="setting-row"><span>始终以纯文本粘贴</span><input type="checkbox" data-setting="plainText"></label>
      </div>
      <div id="permissionState" class="permission-state"><span>辅助功能</span><button id="openPermission">系统设置…</button></div>
      <h2>保留历史</h2>
      <div class="settings-group retention"><input id="retention" type="range" min="0" max="4" step="1" aria-label="保留历史"><div><span>天</span><span>周</span><span>个月</span><span>年</span><span>永久</span></div></div>
    </section>
    <section data-section="privacy" hidden>
      <div class="settings-group">
        <label class="setting-row"><span>忽略机密内容<small>不保存带有密码或机密标记的剪贴板内容。</small></span><input type="checkbox" role="switch" data-setting="ignoreConfidential"></label>
        <label class="setting-row"><span>忽略瞬时内容<small>不保存其他应用生成的临时数据。</small></span><input type="checkbox" role="switch" data-setting="ignoreTransient"></label>
      </div>
      <h2>忽略应用程序</h2>
      <div class="settings-group excluded-group">
        <ul id="excludedApps" aria-label="忽略的应用"></ul>
        <div class="excluded-toolbar"><button id="chooseExcludedApps" class="icon-button" aria-label="添加应用程序" title="添加应用程序"><i data-lucide="plus"></i></button></div>
        <details class="excluded-advanced"><summary>按标识添加</summary><form id="excludeForm"><input id="excludeId" placeholder="com.example.app" aria-label="忽略应用的 Bundle ID" pattern="[A-Za-z0-9_.-]+" maxlength="200" required><button type="submit" class="icon-button" aria-label="添加忽略应用" title="添加"><i data-lucide="plus"></i></button></form></details>
      </div>
    </section>
    <section data-section="shortcuts" hidden>
      <div class="settings-group">
        <div class="setting-row"><span>启动 Paste Easy</span><div class="shortcut-control"><button class="shortcut" data-shortcut="hotkey" aria-label="启动快捷键"></button><button class="icon-button" data-clear-shortcut="hotkey" title="清除快捷键" aria-label="清除启动快捷键"><i data-lucide="x"></i></button></div></div>
        <div class="setting-row"><span>启动 Paste Stack</span><div class="shortcut-control"><button class="shortcut" data-shortcut="stackHotkey" aria-label="Stack 快捷键"></button><button class="icon-button" data-clear-shortcut="stackHotkey" title="清除快捷键" aria-label="清除 Stack 快捷键"><i data-lucide="x"></i></button></div></div>
      </div>
      <div class="settings-group shortcut-list">
        <div class="setting-row"><span>显示下一个 Pinboard</span><div class="shortcut-control"><button class="shortcut" data-shortcut="nextBoardHotkey" aria-label="下一个 Pinboard 快捷键"></button><button class="icon-button" data-clear-shortcut="nextBoardHotkey" title="清除快捷键" aria-label="清除下一个 Pinboard 快捷键"><i data-lucide="x"></i></button></div></div>
        <div class="setting-row"><span>显示上一个 Pinboard</span><div class="shortcut-control"><button class="shortcut" data-shortcut="previousBoardHotkey" aria-label="上一个 Pinboard 快捷键"></button><button class="icon-button" data-clear-shortcut="previousBoardHotkey" title="清除快捷键" aria-label="清除上一个 Pinboard 快捷键"><i data-lucide="x"></i></button></div></div>
      </div>
      <div class="settings-group shortcut-list">
        <label class="setting-row"><span>快速粘贴</span><select data-setting="quickPasteModifier" aria-label="快速粘贴修饰键"><option value="CommandOrControl">⌘ Command + 1…9</option><option value="Control">⌃ Control + 1…9</option><option value="Alt">⌥ Option + 1…9</option></select></label>
        <label class="setting-row"><span>纯文本模式</span><select data-setting="plainTextModifier" aria-label="纯文本修饰键"><option value="Shift">⇧ Shift</option><option value="Alt">⌥ Option</option><option value="Control">⌃ Control</option></select></label>
        <div class="setting-row"><span>预览</span><kbd>Space</kbd></div><div class="setting-row"><span>搜索</span><kbd>⌘F</kbd></div>
      </div>
      <button id="resetHotkey" class="standard-button">重置快捷键</button>
    </section>
    <section data-section="data" hidden>
      <div class="settings-group"><div class="setting-row"><span>剪贴板项目</span><span id="itemCount"></span></div><div class="setting-row"><span>Pinboard</span><span id="boardCount"></span></div></div>
      <div class="data-actions"><button id="exportData" class="standard-button"><i data-lucide="download"></i>导出备份…</button><button id="importData" class="standard-button"><i data-lucide="upload"></i>恢复备份…</button><button id="clearHistory" class="standard-button danger"><i data-lucide="trash-2"></i>删除历史…</button><button id="cancelExport" class="icon-button" aria-label="取消导出" title="取消导出" hidden><i data-lucide="x"></i></button><button id="cancelImport" class="icon-button" aria-label="取消恢复" title="取消恢复" hidden><i data-lucide="x"></i></button></div>
      <p id="exportProgress" role="status" aria-live="polite" hidden></p>
      <p id="importProgress" role="status" aria-live="polite" hidden></p>
      <div id="importPreview" hidden>
        <h2>恢复备份</h2><p id="importSummary"></p>
        <label class="radio-row"><input type="radio" name="importMode" value="merge" checked><span>合并到当前库，保留现有内容</span></label>
        <label class="radio-row"><input type="radio" name="importMode" value="replace"><span>替换当前库，仅保留备份内容</span></label>
        <label class="radio-row"><input type="checkbox" id="restoreSettings"><span>同时恢复偏好设置（含快捷键及隐私排除项）</span></label>
        <label class="radio-row" id="replaceConfirmation" hidden><input type="checkbox" id="confirmReplace"><span>确认替换；当前内容将保存在恢复前备份中</span></label>
        <div class="data-actions"><button id="applyImport" class="standard-button"><i data-lucide="archive-restore"></i>合并备份</button></div>
      </div>
      <button id="revealImportBackup" class="standard-button" hidden><i data-lucide="folder-open"></i>恢复前备份</button>
    </section>
    <section data-section="about" hidden><div class="about"><h2>Paste Easy</h2><p>0.2.0</p><p>本地剪贴板历史</p></div></section>
    <div id="settingsStatus" role="status" hidden></div>
  </main>
  <script src="../node_modules/lucide/dist/umd/lucide.js"></script><script src="model.js"></script><script src="settings.js"></script>
</body></html>
